name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  csharp-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-csharp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      # Cross-language proof: C# verifies the Python-produced sample proof.
      - run: dotnet run -c Release -- ../sample-response.json

  java-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -q package
      # Cross-language proof: Java verifies the Python-produced sample proof.
      - run: mvn -q dependency:build-classpath -Dmdep.outputFile=cp.txt
      - run: java -cp "target/classes:$(cat cp.txt)" com.ledgerrag.verifier.Main ../sample-response.json
