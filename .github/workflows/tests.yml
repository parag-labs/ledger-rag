name: Tests (6 languages)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  csharp-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-csharp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build -c Release
      # Cross-language proof: C# verifies the Python-produced sample proof.
      - run: dotnet run -c Release -- ../sample-response.json

  java-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - run: mvn -q package
      # Cross-language proof: Java verifies the Python-produced sample proof.
      - run: mvn -q dependency:build-classpath -Dmdep.outputFile=cp.txt
      - run: java -cp "target/classes:$(cat cp.txt)" com.ledgerrag.verifier.Main ../sample-response.json

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: go test ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ts/.nvmrc
      - run: npm install
      - run: npm run lint
      - run: npm test
