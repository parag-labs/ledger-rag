<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="800" viewBox="0 0 1580 800" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1580" height="800" fill="#fbfcfe"/><text x="790.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">LedgerRAG - threat model</text><text x="790.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Every answer ships a proof. An untrusted server cannot forge one - a verifier holding only the public key detects any tampering.</text><rect x="48" y="150" width="470" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#e0a13a" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#8c5a0d">UNTRUSTED SERVER</text><rect x="70" y="188" width="426" height="104" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,203) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="116" y="219" font-size="16.5" font-weight="700" fill="#552fae">Merkle ledger + signer</text><text x="87" y="241.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">leaf = SHA-256(0x00 + text)</text><text x="87" y="258.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">node = SHA-256(0x01 + L + R)</text><text x="87" y="276.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">each new root Ed25519-signed, chained</text><rect x="70" y="306" width="426" height="104" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,321) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="116" y="337" font-size="16.5" font-weight="700" fill="#9e2b36">An attacker can tamper</text><text x="87" y="359.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">flip a bit in an indexed chunk</text><text x="87" y="376.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">swap a sibling inside a proof</text><text x="87" y="394.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">alter a root / forge a signature</text><rect x="734.136" y="160.0" width="111.728" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="790" y="176.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">trust boundary</text><rect x="600" y="214" width="380" height="154" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(778.0,228) scale(1.0000)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="790.0" y="272" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3d4a63">What crosses the wire</text><text x="790.0" y="293.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">answer + citations</text><text x="790.0" y="310.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">proofs: sha256 + merkle_path</text><text x="790.0" y="328.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">signed_root: root, prev_root,</text><text x="790.0" y="346.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">leaf_count, signature, public_key</text><path d="M518,300 L600,300" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><path d="M980,300 L1062,300" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="1062" y="150" width="470" height="300" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#2f9e6e" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="1080" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#186547">VERIFIER - PUBLIC KEY ONLY</text><rect x="1082" y="188" width="430" height="104" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1098,203) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1128" y="219" font-size="16.5" font-weight="700" fill="#186547">Three independent checks</text><text x="1099" y="241.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">sig_ok : Ed25519 verify signed root</text><text x="1099" y="258.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">hash_ok: SHA-256(text) == proof.sha256</text><text x="1099" y="276.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">incl_ok: walk merkle_path to the root</text><rect x="1082" y="306" width="430" height="104" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1098,321) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="1128" y="337" font-size="16.5" font-weight="700" fill="#17509f">Verdict</text><text x="1099" y="359.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">verified = sig_ok AND</text><text x="1099" y="376.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">all(hash_ok AND incl_ok)</text><text x="1099" y="394.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">any mismatch -&gt; reject</text><rect x="48" y="500" width="486" height="113.6" rx="11" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="524" font-size="13.2" font-weight="700" fill="#552fae">Why tampering shows up</text><text x="64" y="546" font-size="12.4" fill="#552fae" fill-opacity="0.92">leaf 0x00 vs node 0x01 stops second-preimage:</text><text x="64" y="564.4" font-size="12.4" fill="#552fae" fill-opacity="0.92">a leaf hash can't be replayed as an inner node.</text><text x="64" y="582.8" font-size="12.4" fill="#552fae" fill-opacity="0.92">roots chain over (root, prev_root, leaf_count),</text><text x="64" y="601.1999999999999" font-size="12.4" fill="#552fae" fill-opacity="0.92">so history can't be reordered, truncated, or spliced.</text><rect x="548" y="500" width="486" height="113.6" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="564" y="524" font-size="13.2" font-weight="700" fill="#8c5a0d">Honest limit: tamper-evident, not tamper-proof</text><text x="564" y="546" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">a server holding the signing key can build a fresh,</text><text x="564" y="564.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">self-consistent history - evidence, not proof.</text><text x="564" y="582.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">a third party with a past signed root can prove the</text><text x="564" y="601.1999999999999" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">log was extended, not rewritten (a CT-log model).</text><rect x="1048" y="500" width="484" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="1064" y="524" font-size="13.2" font-weight="700" fill="#3d4a63">One subtlety worth knowing</text><text x="1064" y="546" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">proof.sha256 is the PLAIN SHA-256 of the text.</text><text x="1064" y="564.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">inclusion re-derives the 0x00-prefixed leaf hash.</text><text x="1064" y="582.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">same bytes, two hashes, checked independently.</text><rect x="48" y="640" width="986" height="76.8" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="664" font-size="13.2" font-weight="700" fill="#186547">Cheap enough to check on every answer</text><text x="64" y="686" font-size="12.4" fill="#186547" fill-opacity="0.92">An inclusion proof is log2(n) sibling hashes: a million-entry ledger -&gt; a 20-hash, 640-byte proof.</text><text x="64" y="704.4" font-size="12.4" fill="#186547" fill-opacity="0.92">The reference verifier checks ~44,000 proofs/sec and ~4,300 ed25519 roots/sec in pure Python.</text><rect x="1048" y="640" width="484" height="95.19999999999999" rx="11" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.4" stroke-opacity="0.8"/><text x="1064" y="664" font-size="13.2" font-weight="700" fill="#17509f">Keys</text><text x="1064" y="686" font-size="12.4" fill="#17509f" fill-opacity="0.92">private key: server-side only.</text><text x="1064" y="704.4" font-size="12.4" fill="#17509f" fill-opacity="0.92">public key: shipped in every response -</text><text x="1064" y="722.8" font-size="12.4" fill="#17509f" fill-opacity="0.92">and that is all a verifier needs.</text><text x="790.0" y="782" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/ledger-rag</text></svg>