<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1200" height="1200" fill="#fbfcfe"/><text x="600.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">LedgerRAG - verifiable query sequence</text><text x="600.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Leaves are appended and the root signed at ingest, not per query. A query reads proofs; the client verifies locally with the public key alone.</text><rect x="100" y="128" width="200" height="34" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/><text x="200.0" y="150" text-anchor="middle" font-size="12.6" font-weight="700" fill="#17509f">Client</text><path d="M200.0,162 V1138" stroke="#4285f4" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="500" y="128" width="200" height="34" rx="9" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6"/><text x="600.0" y="150" text-anchor="middle" font-size="12.6" font-weight="700" fill="#552fae">RAG server</text><path d="M600.0,162 V1138" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="900" y="128" width="200" height="34" rx="9" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.6"/><text x="1000.0" y="150" text-anchor="middle" font-size="12.6" font-weight="700" fill="#186547">Ledger</text><path d="M1000.0,162 V1138" stroke="#2f9e6e" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.55"/><rect x="455.15" y="183.5" width="289.7" height="25.0" rx="12.5" fill="#ffffff" stroke="#e0a13a" stroke-opacity="0.4"/><text x="600" y="200.625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8c5a0d">ingest - once per document, not per query</text><path d="M200,238 L600,238" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="339.96" y="226.0" width="120.08" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="400.0" y="242.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">ingest(document)</text><circle cx="200" cy="238" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="200" y="242.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">1</text><rect x="350" y="258" width="470" height="58.4" rx="11" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.8"/><text x="366" y="282" font-size="13.2" font-weight="700" fill="#552fae">prepare leaf</text><text x="366" y="304" font-size="12.4" fill="#552fae" fill-opacity="0.92">chunk + embed, then canonical UTF-8 bytes</text><path d="M600,346 L1000,346" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="732.76" y="334.0" width="134.48000000000002" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="800.0" y="350.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">append_leaf(bytes)</text><circle cx="600" cy="346" r="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/><text x="600" y="350.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b5cf6">2</text><rect x="792" y="366" width="372" height="76.8" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="808" y="390" font-size="13.2" font-weight="700" fill="#186547">reseal the ledger</text><text x="808" y="412" font-size="12.4" fill="#186547" fill-opacity="0.92">rebuild Merkle tree over all leaves</text><text x="808" y="430.4" font-size="12.4" fill="#186547" fill-opacity="0.92">sign root: (root, prev_root, leaf_count)</text><path d="M1000,470 L600,470" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)" stroke-dasharray="7 5"/><rect x="715.696" y="458.0" width="168.608" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="800.0" y="474.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">leaf_index + signed root</text><circle cx="1000" cy="470" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="1000" y="474.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">3</text><rect x="350" y="490" width="470" height="58.4" rx="11" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.8"/><text x="366" y="514" font-size="13.2" font-weight="700" fill="#552fae">store</text><text x="366" y="536" font-size="12.4" fill="#552fae" fill-opacity="0.92">keep text, sha256(text), and leaf_index</text><rect x="488.525" y="577.5" width="222.95" height="25.0" rx="12.5" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="600" y="594.625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#17509f">query - runs on every question</text><path d="M200,632 L600,632" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="342.048" y="620.0" width="115.904" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="400.0" y="636.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">query(question)</text><circle cx="200" cy="632" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="200" y="636.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">4</text><rect x="330" y="652" width="510" height="76.8" rx="11" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.4" stroke-opacity="0.8"/><text x="346" y="676" font-size="13.2" font-weight="700" fill="#552fae">retrieve + answer</text><text x="346" y="698" font-size="12.4" fill="#552fae" fill-opacity="0.92">embed q, search top_k, synthesize answer</text><text x="346" y="716.4" font-size="12.4" fill="#552fae" fill-opacity="0.92">reads the ledger - appends nothing</text><path d="M600,756 L1000,756" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="683.656" y="744.0" width="232.68800000000002" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="800.0" y="760.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">inclusion_proof(leaf_index) per hit</text><circle cx="600" cy="756" r="13" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/><text x="600" y="760.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8b5cf6">5</text><rect x="792" y="776" width="372" height="58.4" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="808" y="800" font-size="13.2" font-weight="700" fill="#186547">read the path</text><text x="808" y="822" font-size="12.4" fill="#186547" fill-opacity="0.92">sibling hashes from the leaf up to the root</text><path d="M1000,862 L600,862" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)" stroke-dasharray="7 5"/><rect x="694.096" y="850.0" width="211.808" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="800.0" y="866.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">merkle_path + head signed root</text><circle cx="1000" cy="862" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="1000" y="866.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">6</text><path d="M600,912 L200,912" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><rect x="262.056" y="900.0" width="275.88800000000003" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="400.0" y="916.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">answer + citations + proofs + signed_root</text><circle cx="600" cy="912" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="600" y="916.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">7</text><rect x="60" y="932" width="560" height="113.6" rx="11" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.4" stroke-opacity="0.8"/><text x="76" y="956" font-size="13.2" font-weight="700" fill="#17509f">verify locally - public key only</text><text x="76" y="978" font-size="12.4" fill="#17509f" fill-opacity="0.92">sig_ok : Ed25519 verify signed root</text><text x="76" y="996.4" font-size="12.4" fill="#17509f" fill-opacity="0.92">hash_ok: SHA-256(text) == proof.sha256</text><text x="76" y="1014.8" font-size="12.4" fill="#17509f" fill-opacity="0.92">incl_ok: walk merkle_path (0x00 leaf) to root</text><text x="76" y="1033.2" font-size="12.4" fill="#17509f" fill-opacity="0.92">accept iff sig_ok AND all(hash_ok AND incl_ok)</text><circle cx="200" cy="1074" r="13" fill="#ffffff" stroke="#2f9e6e" stroke-width="1.8"/><text x="200" y="1078.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f9e6e">8</text><rect x="269.96" y="1062.0" width="120.08" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="330" y="1078.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">accept or reject</text><rect x="660" y="1050" width="490" height="76.8" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="676" y="1074" font-size="13.2" font-weight="700" fill="#3d4a63">the point</text><text x="676" y="1096" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">nothing on the query path is trusted;</text><text x="676" y="1114.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">the proof and public key stand alone.</text><text x="600.0" y="1182" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/ledger-rag</text></svg>