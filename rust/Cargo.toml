[package]
name = "ledger-rag"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Cross-language port of LedgerRAG's Merkle + Ed25519 verifier core"
license = "MIT"

[lib]
name = "ledger_rag"
path = "src/lib.rs"

[[bin]]
name = "ledgerrag-verify"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
ed25519-dalek = "3"
hex = "0.4"
getrandom = "0.4"

[dev-dependencies]
hex = "0.4"
sha2 = "0.11"
